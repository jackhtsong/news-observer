name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            jobs/ingest/requirements.txt
            jobs/llm/requirements.txt
      - run: pip install -r apps/api/requirements.txt -r jobs/ingest/requirements.txt -r jobs/llm/requirements.txt
      - name: API tests (fixtures only; no database or credentials)
        working-directory: apps/api
        run: python -m unittest discover -s tests -v
      - name: Job tests (no network)
        run: |
          python -m unittest discover -s jobs/ingest/tests -t . -v
          python -m unittest discover -s jobs/news/tests -t . -v
          python -m unittest discover -s jobs/llm/tests -t . -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
