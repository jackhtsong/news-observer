# Deployment manifest for the API on Vercel (see server.py). Local development keeps using
# apps/api/requirements.txt; keep the versions here in step with it.
[project]
name = "eye-of-horus-api"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "psycopg[binary]==3.2.13",
  "jsonschema[format]==4.26.0",
  "python-dotenv>=1.0",
]

[tool.vercel]
entrypoint = "server:app"
